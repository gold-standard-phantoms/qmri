# Publishes the documentation to two places, each built separately because site_url differs
# (mkdocs.yml reads it from SITE_URL):
#   docs    the GSP documentation server, http://docs.internal/qmri/ (VPN + GSP sign-in):
#           main publishes "dev", a tag vX.Y.Z publishes "X.Y.Z" and moves "latest"
#   pages   GitHub Pages, https://gold-standard-phantoms.github.io/qmri/ (public, one version):
#           main only
# Both build with Python 3.13 (on 3.10 the resolver picks a mkdocstrings/pymdown-extensions pair
# that fails) and without --frozen, because uv.lock is not committed (see test.yml).

name: Documentation

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    uses: gold-standard-phantoms/github-actions/.github/workflows/deploy-docs.yml@v0.6.0
    with:
      project: qmri
      python_version: "3.13"
      build_command: "uv run mkdocs build --strict"
      use_private_pypi: false
    secrets:
      GSP_DOCS_KEY: ${{ secrets.GSP_DOCS_KEY }}

  pages:
    if: github.ref == 'refs/heads/main'
    uses: gold-standard-phantoms/github-actions/.github/workflows/deploy-pages.yml@v0.6.0
    permissions:
      contents: read
      pages: write
      id-token: write
    with:
      python_version: "3.13"
      build_command: "uv run mkdocs build --strict"
      use_private_pypi: false
